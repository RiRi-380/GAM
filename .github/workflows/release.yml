name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.302'
        
    - name: Restore dependencies
      run: |
        dotnet restore GmodAddonManager.sln '-p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904'

    - name: Test release candidate
      run: |
        dotnet test GmodAddonManager.sln -c Release --no-restore --logger "console;verbosity=minimal"
      
    - name: Build
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag
        if ($version.StartsWith("v")) {
          $version = $version.Substring(1)
        }
        $fileVersion = "$version.0"
        $sha = "${{ github.sha }}"
        $versionProps = @(
          "-p:Version=$version",
          "-p:FileVersion=$fileVersion",
          "-p:AssemblyVersion=$fileVersion",
          "-p:InformationalVersion=$tag+$sha",
          "-p:IncludeSourceRevisionInInformationalVersion=false"
        )

        dotnet build -c Release @versionProps
        # Keep the release self-contained, but publish as multiple files. A single-file
        # bundle extracts native Avalonia/runtime libraries to %TEMP%\.net before the
        # process can show a window, which makes a cold start look like launch failed.
        dotnet publish src/GmodAddonManager.UI/GmodAddonManager.UI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false @versionProps -o publish
      shell: pwsh
      
    - name: Package and verify distribution licenses
      run: |
        ./scripts/prepare-release-notices.ps1 `
          -PublishDirectory publish `
          -ProjectAssetsPath src/GmodAddonManager.UI/obj/project.assets.json
      shell: pwsh
      
    - name: Create portable archive
      run: |
        # Remove 'v' prefix from tag name if present
        $version = "${{ github.ref_name }}"
        if ($version.StartsWith("v")) {
          $version = $version.Substring(1)
        }
        
        Compress-Archive -Path publish/* -DestinationPath GAM-Portable-$version.zip
      shell: pwsh
      
    - name: Setup Inno Setup
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (Test-Path $iscc) {
          Write-Host "Inno Setup is already available at $iscc"
        } else {
          choco install innosetup -y --no-progress
        }
      shell: pwsh
    
    - name: Download VC++ Redistributable
      run: |
        # Create redist directory
        New-Item -ItemType Directory -Force -Path redist
        
        # Download VC++ Redistributable
        Write-Host "Downloading Visual C++ Redistributable..."
        Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
          -OutFile "redist/VC_redist.x64.exe" `
          -UseBasicParsing

        $signature = Get-AuthenticodeSignature "redist/VC_redist.x64.exe"
        if ($signature.Status -ne "Valid" -or
            $signature.SignerCertificate.Subject -notmatch "Microsoft Corporation") {
          throw "VC++ Redistributable signature validation failed: $($signature.Status)"
        }
        
        Write-Host "VC++ Redistributable downloaded and signature-validated successfully"
      shell: pwsh
        
    - name: Build installer
      run: |
        # Create dist directory if it doesn't exist
        New-Item -ItemType Directory -Force -Path dist
        
        # Remove 'v' prefix from tag name if present
        $version = "${{ github.ref_name }}"
        if ($version.StartsWith("v")) {
          $version = $version.Substring(1)
        }
        
        Write-Host "Building installer for version: $version"
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/setup.iss /DMyAppVersion=$version
        Copy-Item "dist\GAM-Setup-$version.exe" "GAM-Setup.exe" -Force
      shell: pwsh
      
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ./GAM-Portable-*.zip
          ./dist/GAM-Setup-*.exe
          ./GAM-Setup.exe
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body_path: ./docs/releases/${{ github.ref_name }}.md
        draft: false
        prerelease: false
        generate_release_notes: true
        fail_on_unmatched_files: true
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
