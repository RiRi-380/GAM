name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'

      - name: Setup Inno Setup
        run: choco install innosetup -y

      - name: Download VC++ Redistributable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path redist | Out-Null
          Invoke-WebRequest `
            -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "redist/VC_redist.x64.exe" `
            -UseBasicParsing

      - name: Build release artifacts
        shell: pwsh
        run: ./build-release.ps1 -Version "${{ github.ref_name }}" -NonInteractive

      - name: Sign update manifest
        shell: pwsh
        env:
          GAM_UPDATE_SIGNING_KEY_B64: ${{ secrets.GAM_UPDATE_SIGNING_KEY_B64 }}
        run: ./scripts/sign-update-manifest.ps1 -Version "${{ github.ref_name }}" -InstallerPath "./GAM-Setup.exe"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            ./GAM-Portable-*.zip
            ./GAM-Setup-*.exe
            ./GAM-Setup.exe
            ./GAM-UpdateManifest-*.json
            ./GAM-UpdateManifest-*.sig
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
