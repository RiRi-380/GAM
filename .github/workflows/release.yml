name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: |
        dotnet restore -r win-x64
      
    - name: Build
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag
        if ($version.StartsWith("v")) {
          $version = $version.Substring(1)
        }
        $fileVersion = "$version.0"
        $sha = "${{ github.sha }}"
        $versionProps = @(
          "-p:Version=$version",
          "-p:FileVersion=$fileVersion",
          "-p:AssemblyVersion=$fileVersion",
          "-p:InformationalVersion=$tag+$sha"
        )

        dotnet build -c Release @versionProps
        dotnet publish src/GmodAddonManager.UI/GmodAddonManager.UI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:IncludeNativeLibrariesForSelfExtract=true @versionProps -o publish
      shell: pwsh
      
    - name: Copy LICENSE
      run: |
        Copy-Item "LICENSE" -Destination "publish/LICENSE" -Force
      shell: pwsh
      
    - name: Create portable archive
      run: |
        # Remove 'v' prefix from tag name if present
        $version = "${{ github.ref_name }}"
        if ($version.StartsWith("v")) {
          $version = $version.Substring(1)
        }
        
        Compress-Archive -Path publish/* -DestinationPath GAM-Portable-$version.zip
      shell: pwsh
      
    - name: Setup Inno Setup
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (Test-Path $iscc) {
          Write-Host "Inno Setup is already available at $iscc"
        } else {
          choco install innosetup -y --no-progress
        }
      shell: pwsh
    
    - name: Download VC++ Redistributable
      run: |
        # Create redist directory
        New-Item -ItemType Directory -Force -Path redist
        
        # Download VC++ Redistributable
        Write-Host "Downloading Visual C++ Redistributable..."
        Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
          -OutFile "redist/VC_redist.x64.exe" `
          -UseBasicParsing
        
        Write-Host "VC++ Redistributable downloaded successfully"
      shell: pwsh
        
    - name: Build installer
      run: |
        # Create dist directory if it doesn't exist
        New-Item -ItemType Directory -Force -Path dist
        
        # Remove 'v' prefix from tag name if present
        $version = "${{ github.ref_name }}"
        if ($version.StartsWith("v")) {
          $version = $version.Substring(1)
        }
        
        Write-Host "Building installer for version: $version"
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/setup.iss /DMyAppVersion=$version
      shell: pwsh
      
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ./GAM-Portable-*.zip
          ./dist/GAM-Setup-*.exe
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
